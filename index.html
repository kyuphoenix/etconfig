<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyTier 配置生成器</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/easytier.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=7">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="theme-toggle">
        <button id="themeCycleBtn" class="theme-icon-btn" type="button" aria-label="主题模式" title="跟随系统">
          <span id="themeCycleIcon" class="theme-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="hero-copy">
        <p class="eyebrow">EasyTier Config Studio</p>
        <h1>easytier配置生成</h1>
      </div>
      <div class="hero-actions">
        <button id="copyTomlBtn" class="primary-btn" type="button">复制 TOML</button>
        <button id="downloadTomlBtn" class="ghost-btn" type="button">下载 config.toml</button>
        <button id="resetBtn" class="ghost-btn" type="button">清空为安全默认值</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel form-panel">
        <div class="panel-head">
          <h2>配置表单</h2>
          <p>布尔值与固定选项使用下拉框；复杂配置支持新增与删除。</p>
        </div>
        <div class="panel-scroll">
          <div id="formRoot" class="form-root"></div>
        </div>
      </section>

      <section class="panel preview-panel">
        <div class="panel-head">
          <h2>实时 TOML</h2>
          <div class="preview-head-actions">
            <p id="statusText">等待输入</p>
            <button
              id="copyTomlMobileBtn"
              class="mobile-copy-btn"
              type="button"
              aria-label="复制 TOML"
              title="复制 TOML"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="9" y="9" width="10" height="10" rx="2"></rect>
                <path d="M15 9V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="panel-scroll preview-scroll">
          <pre id="tomlOutput" class="toml-output"></pre>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./scripts/app.js?v=9"></script>
</body>
</html>
